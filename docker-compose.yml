# CardFolio Docker Compose — Full Stack Deployment
# Usage: docker compose up -d

services:
  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cardfolio
      POSTGRES_USER: cardfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardfolio_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://cardfolio:${POSTGRES_PASSWORD:-cardfolio_dev}@postgres:5432/cardfolio
      OCR_MODEL: ${OCR_MODEL:-glm-4v}
      OCR_API_KEY: ${OCR_API_KEY}
      OCR_API_BASE: ${OCR_API_BASE:-https://open.bigmodel.cn/api/paas/v4}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"

  # ── Web Frontend (built static files served by Nginx) ──
  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  # ── Nginx Reverse Proxy ──
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    profiles: ["production"]  # Only start with --profile production

volumes:
  pgdata:
  uploads:
