worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20M;  # Allow card image uploads

    # ── Backend API ──
    upstream backend {
        server backend:8000;
    }

    # ── Web Frontend ──
    upstream web {
        server web:80;
    }

    server {
        listen 80;
        server_name _;

        # API proxy
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded images
        location /uploads/ {
            proxy_pass http://backend;
        }

        # Swagger docs
        location /docs {
            proxy_pass http://backend;
        }

        # Web frontend (all other routes)
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ── HTTPS (uncomment after SSL cert setup) ──
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #
